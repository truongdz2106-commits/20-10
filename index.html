<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Tặng 20/10 ✨</title>
    <!-- Google Fonts & Canvas Confetti Library -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #ff9a9e 0%, #fecfef 60%, #a1c4fd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* Hiệu ứng vệt sáng lấp lánh khi di chuyển chuột */
        .sparkle {
            position: absolute;
            pointer-events: none;
            background: radial-gradient(circle, #fff 20%, rgba(255,182,193,0.8) 70%, transparent 100%);
            border-radius: 50%;
            animation: fadeOut 1s linear forwards;
            z-index: 999;
        }

        @keyframes fadeOut {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* Tim & hoa bay nền */
        .floating-item {
            position: absolute;
            pointer-events: none;
            animation: flyUp 6s linear infinite;
            bottom: -10vh;
            z-index: 1;
            filter: drop-shadow(0 0 5px rgba(255, 105, 180, 0.5));
        }

        @keyframes flyUp {
            0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 1; }
            100% { transform: translateY(-115vh) rotate(360deg) scale(1.3); opacity: 0; }
        }

        /* Khung thiệp Glassmorphism */
        .card-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.88);
            padding: 40px 25px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 75, 110, 0.25), 0 0 20px rgba(255, 255, 255, 0.8) inset;
            text-align: center;
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            transform: scale(0.95);
            animation: floatCard 4s ease-in-out infinite alternate;
        }

        @keyframes floatCard {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        .heart-icon {
            font-size: 3.5rem;
            display: inline-block;
            animation: heartbeat 1.2s infinite ease-in-out;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px rgba(255, 75, 110, 0.6));
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            background: linear-gradient(45deg, #ff4b6e, #ff758c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.8rem;
            margin-bottom: 15px;
        }

        .message {
            font-size: 1rem;
            color: #444;
            line-height: 1.7;
            min-height: 90px;
            margin-bottom: 20px;
            white-space: pre-line;
            font-weight: 600;
        }

        /* Nút bấm thiết kế 3D */
        .btn-love {
            background: linear-gradient(45deg, #ff4b6e, #ff758c);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 75, 110, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
            margin-bottom: 15px;
        }

        .btn-love:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 25px rgba(255, 75, 110, 0.6);
        }

        /* Khung hiển thị 3 ảnh bất ngờ */
        .surprise-box {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed #ffb6c1;
            animation: fadeIn 0.8s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .surprise-title {
            color: #ff4b6e;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .img-slot {
            position: relative;
            aspect-ratio: 1 / 1;
            border: 2px solid #ff758c;
            border-radius: 12px;
            background: #fff0f3;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(255, 75, 110, 0.15);
        }

        .img-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Nhạc nền lãng mạn -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://assets.mixkit.co/music/preview/mixkit-romantic-sunset-688.mp3" type="audio/mpeg">
    </audio>

    <!-- Khung thiệp chính -->
    <div class="card-container">
        <div class="heart-icon">💖</div>
        <h1>Chúc Mừng 20/10!</h1>
        <div class="message" id="typing-text"></div>

        <button class="btn-love" id="btnSurprise">🎁 Bấm vào đây có bất ngờ!</button>

        <!-- Vùng hiển thị 3 ảnh có sẵn từ máy -->
        <div class="surprise-box" id="surpriseBox">
            <div class="surprise-title">✨ Kỷ Niệm Đáng Yêu ✨</div>
            <div class="image-grid">
                
                <!-- Ảnh 1 -->
                <div class="img-slot">
                    <img src="images/anh1.jpg" alt="Kỷ niệm 1">
                </div>

                <!-- Ảnh 2 -->
                <div class="img-slot">
                    <img src="images/anh2.jpg" alt="Kỷ niệm 2">
                </div>

                <!-- Ảnh 3 -->
                <div class="img-slot">
                    <img src="images/anh3.jpg" alt="Kỷ niệm 3">
                </div>

            </div>
        </div>
    </div>

    <script>
        const content = "Chúc chị luôn xinh đẹp, rạng rỡ, ngập tràn hạnh phúc và nhận được thật nhiều tình yêu thương trong ngày Phụ nữ Việt Nam 20/10! ✨🌸💖";
        let index = 0;
        let isMusicPlaying = false;

        // 1. Hiệu ứng gõ chữ
        function typeWriter() {
            if (index < content.length) {
                document.getElementById("typing-text").innerHTML += content.charAt(index);
                index++;
                setTimeout(typeWriter, 45);
            }
        }

        // 2. Tạo tim & hoa bay nền ngẫu nhiên
        function createFloatingItems() {
            const symbols = ["❤️", "🌸", "💖", "🌷", "✨", "🌺"];
            setInterval(() => {
                const item = document.createElement("div");
                item.classList.add("floating-item");
                item.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
                item.style.left = Math.random() * 100 + "vw";
                item.style.fontSize = (Math.random() * 15 + 18) + "px";
                item.style.animationDuration = (Math.random() * 3 + 4) + "s";
                document.body.appendChild(item);

                setTimeout(() => { item.remove(); }, 6000);
            }, 250);
        }

        // 3. Vệt sáng lấp lánh theo con trỏ chuột
        window.addEventListener("mousemove", (e) => {
            const sparkle = document.createElement("div");
            sparkle.classList.add("sparkle");
            sparkle.style.left = e.pageX + "px";
            sparkle.style.top = e.pageY + "px";
            const size = Math.random() * 8 + 4;
            sparkle.style.width = size + "px";
            sparkle.style.height = size + "px";
            document.body.appendChild(sparkle);

            setTimeout(() => { sparkle.remove(); }, 1000);
        });

        // 4. Hiển thị 3 ảnh + Pháo hoa khi nhấp nút
        function triggerSurprise() {
            const music = document.getElementById("bg-music");
            if (!isMusicPlaying) {
                music.play().catch(() => {});
                isMusicPlaying = true;
            }

            // Hiện vùng chứa 3 ảnh
            document.getElementById("surpriseBox").style.display = "block";

            // Pháo hoa giấy bùng nổ
            const count = 200;
            const defaults = { origin: { y: 0.7 } };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, { spread: 26, startVelocity: 55 });
            fire(0.2, { spread: 60 });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });
        }

        // Khởi chạy khi trang tải xong
        window.addEventListener("DOMContentLoaded", () => {
            setTimeout(typeWriter, 600);
            createFloatingItems();

            const btn = document.getElementById("btnSurprise");
            if (btn) {
                btn.addEventListener("click", triggerSurprise);
            }
        });
    </script>
</body>
</html>
